## Kardinalita sa vytvorí pri importe kombináciou vlastností "required" a "mutlivalued" nasledovne:
## 1..* - slot je required a multivalued
## 1..1 - slot je required ale nie multivalued
## 0..* - slot nie je required ale je multivalued
## 0..1 - slot nie je required a nie je multivalued
##
## ak nie je uvedené, default je false (nie je)

classes:
  DP1:
    description: Sociálna poisťovňa na Slovensku poskytuje rôzne dávky, vrátane nemocenských a dôchodkových dávok.
    tree_root: true
    attributes:
      Applicant:
        description: Informácie o žiadateľovy
        range: ApplicantType
      Result:
        description: Výsledok požadovanej služby, obsahuje dáta špecifické tejto službe.
        range: ResultType
  
  ResultType:
    description: Zložený dátový typ ResultType
    attributes:
      ConfirmationDate:
        description: Dátum, ku ktorému bol zistený stav poberania dôchodkových dávok
        range: date
      PensionBenefitsInfo:
        description: Informácie o vyplácaní dôchodkových dávok - akt stav vyplácania
        range: PensionBenefitsInfo
      AdditionalComments:
        description: Doplňujúce poznámky k potvrdeniu o vyplácaných dôchodkvých dávkach
        range: AdditionalComments

  PensionBenefitsInfo:
    description: Informácie o vyplácaní dôchodkových dávok - akt stav vyplácania
    attributes:
      PensionBenefit:
        description: zložený dátový typ s opakovaním - PensionBenefit
        range: PensionBenefit
        multivalued: true

  PensionBenefit:
    description: zložený dátový typ  PensionBenefit  
    attributes:
      benefitType:
        description: Kód označenia druhu dôchodkovej dávky (S, PS, I, V, Vd, D, Smin, Imin)
        range: string
        keywords:
          - attribute
      benefitDesc:
        description: Názov / Popis druhu dôchodkovej dávky
        range: string
        keywords:
          - attribute
      isPaid:
        description: Informácia, či je dôchodková dávka vyplácaná (0/1)
        range: string
        keywords:
          - attribute
      isPaidText:
        description: Informácia, či je dôchodková dávka vyplácaná (Áno/Nie)
        range: string
        keywords:
          - attribute
      isMinAmount:
        description: "Informácia, či je dôchodková dávka vyplácaná vo výške minimálneho dôchodku (iba pre benefitType: S, I)"
        range: string
        keywords:
          - attribute
      Orphans:
        description: "Zoznam detí - sirôt, ak je poberateľovi vyplácaný aj sirotský dôchodok detí (uvádza sa iba pod sirotským dôchodkom /benefitType: Dd/, ak nie je vyplácaná samotnej sirote)"
        range: Orphans

  Orphan:
    description: Informácia o jednom dieťati - sirote
    attributes:
      givenName:
        description: Nededená časť mena osoby, zväčša získané pri narodení
        range: string
        keywords:
          - attribute
      familyName:
        description:  Dedená časť mena osoby, označované tiež ako priezvisko
        range: string
        keywords:
          - attribute
      dateOfBirth:
        description: Dátum narodenia
        range: date
        keywords:
          - attribute
      
  Orphans:
    description: zložený dátový typ Orphans
    attributes:
      Orphan:
        description: zložený dátový typ s opakovaním Orphan
        multivalued: true
        range: Orphan


