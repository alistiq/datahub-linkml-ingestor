id: sp.dp1
name: DP1
title: Poskytnutie údajov o výplate dôchodkových dávok SP bez sumy (DP1)
version: 1.0.0

description: |
  Sociálna poisťovňa na Slovensku poskytuje rôzne dávky, vrátane **nemocenských** a **dôchodkových** dávok. Tu je stručný prehľad o týchto dvoch druhoch dávok:
  1. **Nemocenské dávky**: Nemocenské dávky sú poskytované poistencovi, ktorý je pracovne neschopný v dôsledku ochorenia alebo úrazu. Poistenci majú nárok na nemocenské dávky počas doby lekárskej práceneschopnosti, ktorú určí lekár. Výška nemocenskej dávky je určená na základe príjmu poistenca v predchádzajúcom období. Nemocenské dávky sú vyplácané prostredníctvom Sociálnej poisťovne.
  2. **Dôchodkové dávky**: Sociálna poisťovňa poskytuje rôzne typy dôchodkových dávok, ktoré slúžia na zabezpečenie príjmu poistencov po dosiahnutí dôchodkového veku, pri invalidite alebo pri stratových udalostiach. Medzi najčastejšie typy dôchodkových dávok patria starobný dôchodok, invalidný dôchodok, vdovský dôchodok, vdovecký dôchodok, sirotský dôchodok a dôchodok pre výsluhu. Výška dôchodkových dávok závisí od príspevkov zaplatených do sociálneho poistenia a ďalších faktorov stanovených zákonom.

  V prípade nároku na nemocenské alebo dôchodkové dávky je potrebné kontaktovať Sociálnu poisťovňu a podať príslušnú žiadosť. Je dôležité splniť určité podmienky a predložiť potrebnú dokumentáciu pre overenie nároku na dávky.

  Podrobné informácie o nemocenských a dôchodkových dávkach Sociálnej poisťovne, vrátane aktuálnych pravidiel, výpočtov a postupov, sú k dispozícii na webových stránkach Sociálnej poisťovne alebo prostredníctvom ich kontaktného centra.

