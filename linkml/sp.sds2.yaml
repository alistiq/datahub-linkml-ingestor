## 0..1 - slot nie je required a nie je multivalued
##
## ak nie je uvedené, default je false (nie je)


classes:
  SDS2:
    description: Sociálna poisťovňa na Slovensku poskytuje rôzne dávky, vrátane nemocenských a dôchodkových dávok.
    tree_root: true


  ResultType:
    description: Zložený dátový typ ResultType
    attributes:
      ConfirmationDate:
        description: Dátum, ku ktorému bol zistený stav poberania dôchodkových dávok
        range: date
        required: true
      PensionBenefitsInfo:
        description: Informácie o vyplácaní dôchodkových dávok - akt stav vyplácania
        range: PensionBenefitsInfo
      AdditionalComments:
        description: Doplňujúce poznámky k potvrdeniu o vyplácaných dôchodkvých dávkach
        range: AdditionalComments
        multivalued: true

  PensionBenefitsInfo:
    description: Informácie o vyplácaní dôchodkových dávok - akt stav vyplácania
    attributes:
      PensionBenefit:
        description: zložený dátový typ s opakovaním PensionBenefit
        range: PensionBenefit
        multivalued: true
      Total:
        description: 
        range: float
        required: true

  PensionBenefitType:
    description: zložený dátový typ PensionBenefitType
    attributes:
      Name:
        description: Doživotný dôchodok, Dočasný dôchodok, Programový výber
        range: string
        required: true
      Value:
        description: "enumerácia - hodnoty: áno, nie"
        range: string
        required: true
