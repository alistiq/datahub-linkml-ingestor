default_range: string
imports:
  - linkml:types
  - sp
  


## Kardinalita sa vytvorí pri importe kombináciou vlastností "required" a "mutlivalued" nasledovne:
## 1..* - slot je required a multivalued
## 1..1 - slot je required ale nie multivalued
## 0..* - slot nie je required ale je multivalued
## 0..1 - slot nie je required a nie je multivalued
##
## ak nie je uvedené, default je false (nie je)


classes:
  SDS3:
    description: Sociálna poisťovňa na Slovensku poskytuje rôzne dávky, vrátane nemocenských a dôchodkových dávok.
    tree_root: true
    attributes:
      Applicant:
        description: Informácie o žiadateľovy
        range: ApplicantType
        required: true
      Result:
        description: Výsledok požadovanej služby, obsahuje dáta špecifické tejto službe.
        range: ResultType

  BranchOfficeType:
    description: zložený dátový typ BranchOfficeType 
    attributes:
      Name:
        description: Názov
        range: string
        required: true
      PhysicalAddress:
        description: Adresa
        range: string
        required: true

  PersonDataType: 
    description: Zložený dátový typ údajov o osobe (fyzickej alebo právnickej)
    attributes:
      PhysicalPerson: 
        description: Údaje o fyzickej osobe
        range: PhysicalPersonType
        required: true
      ID: 
        description: Údaje o identifikátore osoby
        range: IDType
        required: true



  CodelistType:
    description: zložený dátový typ  - CodelistType
    mixins: 
      - IsCodelist

  CodelistCType:
    description: Zložený dátový typ pre hodnoty z číselníka
    attributes:
      CodelistCode:
        description: Kódové označenie číselníka
        range: string
        required: true
      CodelistItem:
        description: Položka z číselníka
        range: CodelistItemCType
        required: true

  CodelistItemCType: 
    description: Zložený dátový typ pre konkrétnu hodnotu z číselníka
    attributes:
      ItemCode:
        description: kód položky
        range: string
        required: true
      ItemName:
        description: názov položky
        range: string
        required: true

  BirthType: 
    description: Zložený dátovy typ údajov o narodené osoby
    attributes:
      DateOfBirth:
        description: Dátum narodenia
        range: date 
        

  ResultType:
    description: Zložený dátový typ ResultType
    attributes:
      ConfirmationDate:
        description: Dátum, ku ktorému bol zistený stav poberania dôchodkových dávok
        range: date
        required: true
      Period:
        description: Časové obdobie dát
        required: true
      PensionBenefitsInfo:
        description: Informácie o vyplácaní dôchodkových dávok - akt stav vyplácania
        range: PensionBenefitsInfo
      Total:
        description: Suma dôchodku
        range: zložený dátový typ - TotalType
      AdditionalComments:
        description: Doplňujúce poznámky k potvrdeniu o vyplácaných dôchodkvých dávkach
        range: string
        multivalued: true
  
  ApplicantType: 
    description: Zložený dátový prvok ApplicantType
    attributes:
      PersonData:
        description: Osobné údaje žiadateľa
        range: PersonDataType
        required: true
  
  PhysicalPersonType:
    description: Zložený dátový typ údajov o fyzickej osobe
    attributes:
      PersonName:
        description: Informácie o mene fyzickej osoby
        range: PersonNameType
        required: true
      Birth:
        description: Informácie o narodené fyzickej osoby
        range: BirthType



  PeriodType:
    description: zložený dátový typ PeriodType     
    attributes:
      Start:
        description: Začiatok obdobia
        range: string
        required: true
      End:
        description: Koniec obdobia
        range: string
        required: true

  PensionBenefitsItemType:
    description: zložený dátový typ PensionBenefitsItemType      
    attributes:
      Period:
        description: Časové obdobie dát
        range: string
      Live:
        description: Doživotný dôchodok
        range: string
      Temporary:
        description: Dočasný dôchodok
        range: string
      Program:
        description: Programový výber
        range: string

  TotalType:
    description: zložený dátový typ TotalType    
    attributes:
      Live:
        description: Doživotný dôchodok
        range: string
      Temporary:
        description: Dočasný dôchodok
        range: string
      Program:
        description: Programový výber
        range: string

  PersonNameType: 
    description: Zložený dátový typ údajov o mene osoby
    attributes:
      GivenName:
        description: Nededená časť mena osoby, zväčša získané pri narodení
        range: string
        multivalued: true 
        required: true
      FamilyName:
        description: Dedená časť mena osoby, označované tiež ako priezvisko
        range: string
        multivalued: true 
        required: true
      Affix:
        description: Dodatok k menu, spravidla obsahuje tituly pred a za menom
        range: AffixType
        multivalued: true
      FormattedName:
        description: Naformátované celé meno osoby tak, ako by sa malo zobrazovať používateľom
        range: string

        
  AffixType:  
    description: Dodatok k menu, spravidla obsahuje tituly pred a za menom
    mixins:
      - IsCodelist 
    attributes: 
      type: 
        description: typ dodatku, pred alebo za menom
        range: string
        keywords:
          - attribute
      position: 
        description: pozícia vrámci ostatných dodatkov
        range: string
        keywords:
          - attribute