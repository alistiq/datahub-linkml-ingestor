id: sp.sds3
name: sds3
title: Evidencia poberateľov dôchodkov so SDS (II. Pilier)(SDS2)
version: 1.0.0


description: |
  Evidencia poberateľov dôchodkov z druhého piliera starobného dôchodkového sporenia (tzv. II. pilier) je systém zaznamenávania a sledovania údajov o jednotlivých poberateľoch dôchodkov, ktorí si v rámci tohto piliera vytvorili svoj dôchodkový účet.

  V II. pilieri sa jedná o dobrovoľný systém, kde jednotlivci dobrovoľne prispievajú časť svojho príjmu do osobného dôchodkového konta, ktorého cieľom je zhromažďovať finančné prostriedky pre budúce dôchodkové dávky. Tieto finančné prostriedky sú potom spravované dôchodkovými správcami, ktorí ich investujú do rôznych finančných nástrojov s cieľom dosiahnuť zhodnotenie.

  Evidencia poberateľov dôchodkov z druhého piliera zaznamenáva nasledujúce údaje:

  1.**Identifikačné údaje**: Meno, priezvisko, rodné číslo alebo iný identifikačný údaj, ktorý jednoznačne identifikuje poberateľa dôchodku.
  2.**Údaje o dôchodkovom účte**: Informácie o dôchodkovom účte, vrátane sumy príspevkov zaplatených poberateľom, zhodnotenia účtu, pripisovania a odpisovania prostriedkov a iných finančných transakcií.
  3.**Kontaktné údaje**: Adresa, telefónne číslo, e-mailová adresa a ďalšie údaje, ktoré slúžia na komunikáciu so poberateľom dôchodku.
  4.**História príspevkov a výplat**: Informácie o príspevkoch zaplatených poberateľom do dôchodkového účtu, ako aj o výplatoch dôchodkových dávok.

  Evidencia poberateľov dôchodkov z druhého piliera je dôležitým nástrojom na sledovanie a správu dôchodkových kont a zaisťuje transparentnosť a kontrolu nad vývojom finančných prostriedkov v rámci tohto piliera. Správcovia dôchodkových fondov a príslušné inštitúcie sú zodpovedné za správu a aktualizáciu tejto evidencie.

